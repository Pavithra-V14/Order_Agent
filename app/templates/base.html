<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Order Exception Agent{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js"></script>
</head>
<body data-page="{{ page_id }}"{% block body_attrs %}{% endblock %}>
  <div class="app-shell">
    <nav class="rail">
      <div class="rail-title">
        <div class="rail-logo">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 2L28 8V17C28 24 22.5 29 16 30C9.5 29 4 24 4 17V8L16 2Z" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.6"/>
            <path d="M11 16.5L14.5 20L21.5 12" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="rail-wordmark">Order Exception<br>Agent</div>
      </div>
      <div class="rail-nav">
        <a href="/" class="{{ 'active' if page_id == 'dashboard' else '' }}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="3" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="9" width="14" height="3" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="14" width="14" height="3" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
          Case Queue
        </a>
        <a href="/escalations" class="{{ 'active' if page_id == 'escalations' else '' }}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M10 3L17 16H3L10 3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 8V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="13.5" r="0.9" fill="currentColor"/></svg>
          Escalations
        </a>
        <a href="/policies" class="{{ 'active' if page_id == 'policies' else '' }}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M5 3H12L15 6V17H5V3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 3V6H15" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.5 10H12.5M7.5 13H12.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Policy Documents
        </a>
        <a href="/metrics" class="{{ 'active' if page_id == 'metrics' else '' }}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 17V3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M3 17H17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M6 14V10M10 14V7M14 14V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Metrics
        </a>
        <a href="/testing" class="{{ 'active' if page_id == 'testing' else '' }}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M6 8.5L9 11.5L14 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="3" width="14" height="14" rx="2.5" stroke="currentColor" stroke-width="1.4"/></svg>
          Testing
        </a>
        <a href="/threshold-config" class="{{ 'active' if page_id == 'threshold' else '' }}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.4"/><path d="M10 7V10L12 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Threshold Config
        </a>
        <a href="/audit-log" class="{{ 'active' if page_id == 'audit' else '' }}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M4 4H16V16H4V4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 8H13M7 11H13M7 14H10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Audit Log
        </a>
        <a href="/admin" class="{{ 'active' if page_id == 'admin' else '' }}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M10 2.5L16.5 5.5V10C16.5 13.5 13.7 16.5 10 17.5C6.3 16.5 3.5 13.5 3.5 10V5.5L10 2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          Admin
        </a>
      </div>
      <div style="margin-top:auto; padding:12px; font-size:11px;">
        <div id="signed-in-widget" style="display:none; margin-bottom:10px;">
          <div style="color:var(--rail-text); margin-bottom:2px;">Signed in as</div>
          <div id="signed-in-name" style="color:#fff; font-weight:600; margin-bottom:2px;"></div>
          <div id="signed-in-role" style="color:var(--text-faint); margin-bottom:6px;"></div>
          <a href="#" id="sign-out-link" style="color:var(--accent);">Sign out</a>
        </div>
        <div id="signed-out-widget" style="display:none; margin-bottom:10px;">
          <a href="/login" style="display:block; color:#fff; margin-bottom:4px;">Sign In</a>
          <a href="/signup" style="display:block; color:var(--accent);">Sign Up</a>
        </div>
        <details>
          <summary style="color:var(--text-faint); cursor:pointer;">Service API key (advanced)</summary>
          <label style="color:var(--text-secondary); display:block; margin:6px 0 4px;">API Key</label>
          <input type="password" id="global-api-key-input" placeholder="X-API-Key" style="width:100%; font-size:11px; padding:4px;">
          <div id="global-api-key-status" style="margin-top:4px; color:var(--text-secondary);"></div>
        </details>
      </div>
    </nav>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
