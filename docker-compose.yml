# Staging/production stack — NOT used in this sandbox (no Docker available
# here; Phase 0 was built and tested against SQLite + Qdrant's embedded
# local mode instead, see app/core/config.py). Run this on your own machine
# once you're ready to move off the local-first defaults.
#
# Usage:
#   cp .env.example .env        # fill in real API keys
#   docker compose up -d postgres redis qdrant
#   # then point DATABASE_URL / REDIS_URL / QDRANT_URL in .env at these
#   # services (hostnames below) and run the app either in or outside Docker.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_exception_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_dev_password   # override in real deployments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # Uncomment once the app is containerized (later phase) — for now it's run
  # directly with uvicorn against the services above.
  # app:
  #   build: .
  #   env_file: .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     qdrant:
  #       condition: service_started
  #   ports:
  #     - "8000:8000"

volumes:
  pgdata:
  qdrant_data:
