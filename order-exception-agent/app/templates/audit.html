{% extends "base.html" %}
{% block title %}Audit Log{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Audit Log</h1>
  <p>Append-only record of every state transition and agent/tool decision.</p>
</div>
<form id="audit-filter-form" style="margin-bottom:16px; display:flex; gap:8px; max-width:420px;">
  <input type="text" id="audit-case-filter" placeholder="Filter by case ID (optional)">
  <button type="submit">Filter</button>
</form>
<table>
  <thead>
    <tr><th>Time</th><th>Case</th><th>Actor</th><th>Action</th><th>Detail</th></tr>
  </thead>
  <tbody id="audit-tbody">
    <tr><td colspan="5"><div class="empty-state">Loading...</div></td></tr>
  </tbody>
</table>
{% endblock %}
